name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # релиз по тегу подписывается только своим ключом: debug-ключ раннера каждый раз новый,
      # и такой APK не встанет поверх прошлой версии
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fixer-release.jks"
            echo "FIXER_KEYSTORE=$RUNNER_TEMP/fixer-release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Нет секрета KEYSTORE_BASE64 — релиз нельзя подписать (см. docs/RELEASE.md)"
            exit 1
          fi
      - name: Тесты и сборка
        env:
          FIXER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FIXER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIXER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Fixer-apk
          path: app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fixer-apk
      - name: Переименовать APK
        run: |
          mv *.apk "Fixer-${GITHUB_REF_NAME}.apk"
          sha256sum Fixer-*.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Fixer-*.apk
            SHA256SUMS.txt
